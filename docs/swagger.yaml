basePath: /
definitions:
  model.APIResponse:
    properties:
      code:
        description: e.g. 200, 400, 401
        type: integer
      data:
        description: optional payload for success
      message:
        description: human-readable message
        type: string
    type: object
  model.ChangePasswordRequest:
    properties:
      new_password:
        example: Secret123!
        type: string
      old_password:
        example: Secret123!
        type: string
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  model.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  model.RegisterPayload:
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        type: string
      password:
        example: Secret123!
        type: string
      phone:
        example: "09123456789"
        type: string
    type: object
  model.UpdateUserRequest:
    properties:
      name:
        example: John Doe
        type: string
      phone:
        example: "09123456789"
        type: string
    type: object
  model.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
    type: object
  request.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  request.PromoteUserRequest:
    properties:
      user_id:
        example: 123
        type: integer
    type: object
  request.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
host: localhost:8085
info:
  contact:
    email: your.email@example.com
    name: Your Name
    url: https://your-portfolio.com
  description: A modular monolithic backend in Golang using Echo, MySQL, Docker, and
    JWT for user authentication.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  termsOfService: http://yourdomain.com/terms/
  title: Go User Authentication API
  version: "1.0"
paths:
  /admin/dashboard:
    get:
      consumes:
      - application/json
      description: Access protected admin dashboard
      produces:
      - application/json
      responses:
        "200":
          description: welcome to the admin dashboard
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin dashboard
      tags:
      - Admin
  /admin/promote:
    put:
      consumes:
      - application/json
      description: Admins can promote a user to admin role
      parameters:
      - description: User ID payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.PromoteUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user promoted to admin successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Promote a user to admin
      tags:
      - Admin
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Authenticated user can change their password by providing the old
        and new password
      parameters:
      - description: Change Password Payload
        in: body
        name: change
        required: true
        schema:
          $ref: '#/definitions/model.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: password updated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: validation or bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized – wrong password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - User
  /auth/delete:
    delete:
      description: Deletes the authenticated user’s account permanently
      produces:
      - application/json
      responses:
        "200":
          description: user deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - User
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Get authenticated user profile info
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - user
  /auth/update:
    put:
      consumes:
      - application/json
      description: Allows an authenticated user to update their name and phone
      parameters:
      - description: Update Payload
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/model.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user updated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: validation or bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - User
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset link. If the email exists, a reset link
        will be sent.
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - auth
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and get JWT tokens
      parameters:
      - description: Login payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.LoginResponse'
              type: object
        "400":
          description: Bad Request - invalid input
          schema:
            $ref: '#/definitions/model.APIResponse'
        "401":
          description: Unauthorized - invalid credentials
          schema:
            $ref: '#/definitions/model.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: User login
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User Registration Data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.RegisterPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Register a new user
      tags:
      - auth
  /reset-password:
    post:
      consumes:
      - application/json
      description: Reset password using a valid token
      parameters:
      - description: Reset password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset user password
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
