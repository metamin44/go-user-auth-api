
version: '3.8'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: amink
      MYSQL_DATABASE: userdb
      MYSQL_USER: user
      MYSQL_PASSWORD: amink
    ports:
      - "3320:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitor-net

  app1:
    build: .
    env_file:
      - .env
    ports:
      - "8085:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: user
      DB_PASS: amink
      DB_NAME: userdb
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATION: "true"
    networks:
      - monitor-net

  app2:
    build: .
    env_file:
      - .env
    ports:
      - "8086:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: user
      DB_PASS: amink
      DB_NAME: userdb
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATION: "false"
    networks:
      - monitor-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    depends_on:
      - app1
      - app2  
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus  
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitor-net

volumes:
  grafana-storage:

networks:
  monitor-net: